apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-demo
  template:
    metadata:
      labels:
        app: go-demo
    spec:
      containers:
      - name: go-demo
        image: go-demo:v5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: APP_VER
          valueFrom:
            configMapKeyRef:
              name: go-demo-cm
              key: APP_VER
        - name: APP_MSG
          valueFrom:
            configMapKeyRef:
              name: go-demo-cm
              key: APP_MSG
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: go-demo-secret
              key: DB_PASSWORD
        # =========资源限制=========
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        # =========就绪探针readiness=========
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
        # =========存活探针liveness=========
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: go-demo-svc
spec:
  type: NodePort
  selector:
    app: go-demo
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
