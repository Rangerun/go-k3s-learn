apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-demo
  template:
    metadata:
      labels:
        app: go-demo
    spec:
      containers:
      - name: go-demo
        image: go-demo:v2
        imagePullPolicy: IfNotPresent   #重点！优先本地，不去远端拉
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: go-demo-svc
spec:
  selector:
    app: go-demo
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
